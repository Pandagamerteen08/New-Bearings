[package]
name = "new-bearings"
version = "0.1.0"
edition = "2024"
description = "A cross-platform, accessible learning companion"
license = "MIT"
repository = "https://github.com/Pandagamerteen08/New-Bearings"
publish = false

[[bin]]
name = "new-bearings"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Embeds the built interface in the executable instead of loading it from the
# development server. `tauri build` enables this automatically; without it even
# a release binary expects Vite to be running.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[dev-dependencies]
