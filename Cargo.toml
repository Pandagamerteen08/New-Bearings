[package]
name = "new-bearings"
version = "0.1.0"
edition = "2024"
description = "A cross-platform, accessible learning companion"
license = "MIT"
repository = "https://github.com/Pandagamerteen08/New-Bearings"
publish = false

[[bin]]
name = "new-bearings"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1"
