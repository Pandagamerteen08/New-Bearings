name: New Bearings CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # Tauri links against the system WebView. Without these packages the
      # webkit2gtk build script cannot resolve them through pkg-config and
      # even `cargo check` fails on Linux runners.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Check compilation
        shell: bash
        run: |
          set -o pipefail

          if cargo check --all-targets 2>&1 | tee cargo-check.log; then
            exit 0
          fi

          # Surface the failure as annotations, so a failure on a platform
          # nobody develops on can be understood from the run summary alone.
          {
            grep -i -m 4 -E "error|not found|fatal|cannot find|failed" cargo-check.log
            echo "--- end of log ---"
            tail -n 5 cargo-check.log
          } | while IFS= read -r line; do
            echo "::error::${line}"
          done

          exit 1

      - name: Run tests
        run: cargo test

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        run: npm run build
